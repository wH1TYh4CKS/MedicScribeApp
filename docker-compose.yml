services:
  server:
    build: ./server
    container_name: medicscribe-server
    ports:
      - "8080:8080"
    environment:
      MEDICSCRIBE_HOST: "0.0.0.0"
      MEDICSCRIBE_PORT: "8080"
      MEDICSCRIBE_LLM_BASE_URL: "http://vllm:8000/v1"
    volumes:
      - ./data:/app/data
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scribe-net

  vllm:
    image: vllm/vllm-openai:v0.6.3
    container_name: medicscribe-vllm
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
    command:
      - --model=Qwen/Qwen2.5-14B-Instruct-AWQ
      - --quantization=awq
      - --max-model-len=32768
      - --gpu-memory-utilization=0.55
      - --port=8000
      - --served-model-name=qwen2.5-14b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://127.0.0.1:8000/v1/models\").read()' || exit 1"]
      interval: 30s
      start_period: 300s
      retries: 20
    shm_size: '8gb'
    restart: unless-stopped
    networks:
      - scribe-net

networks:
  scribe-net:
    driver: bridge
