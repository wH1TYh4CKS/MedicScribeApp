# MedicScribe server stack
# llama-cpp runs bare-metal (GPU access) — use scripts/start-llm.sh
# This compose file manages only the FastAPI server.

services:
  server:
    build: ./server
    container_name: medicscribe-server
    network_mode: host          # reaches localhost:8000 (llama-cpp) + LAN clients hit :8080
    volumes:
      - ./data:/app/data
      - ./llm:/llm:ro           # config paths: MEDICSCRIBE_*_CONFIG_PATH env vars below
    environment:
      MEDICSCRIBE_HOST: "0.0.0.0"
      MEDICSCRIBE_PORT: "8080"
      MEDICSCRIBE_ASR_CONFIG_PATH: "/llm/models/asr.yaml"
      MEDICSCRIBE_NOTE_CONFIG_PATH: "/llm/models/note_llm.yaml"
      MEDICSCRIBE_LLM_ROOT: "/llm"
    restart: unless-stopped
