# MedicScribe — central project properties
# Java-style key=value. Loaded by server (pydantic-settings via .env shim) and
# referenced by Android build via gradle properties bridge (TBD Phase 0).
# Lines beginning with '#' are comments. No trailing whitespace.

# ---------- App metadata ----------
app.name=MedicScribe
app.version=0.0.1
app.codename=phase0-scaffold
app.license=Proprietary

# ---------- Server: network ----------
server.host=0.0.0.0
server.port=8080
server.ws.path=/ws/scribe
server.health.path=/health
server.cors.allowed_origins=*

# ---------- Server: ASR ----------
asr.engine=faster-whisper
asr.model=large-v3
asr.device=cuda
asr.compute_type=float16
asr.beam_size=5
asr.vad.engine=silero
asr.vad.threshold=0.5
asr.stream.window_seconds=5
asr.stream.hop_seconds=1
asr.languages=en,zh,ms,ta

# ---------- Server: note LLM ----------
llm.engine=vllm
llm.model=Qwen/Qwen2.5-14B-Instruct-AWQ
llm.max_model_len=32768
llm.gpu_memory_utilization=0.55
llm.max_tokens=800
llm.temperature=0.2
llm.top_p=0.9
llm.guided_decoding=true

# ---------- Notes ----------
notes.default_template=soap_v1
notes.templates_dir=llm/templates
notes.custom_templates_dir=llm/custom
notes.prompts_dir=llm/prompts
notes.latency_budget_seconds=30

# ---------- Model registry (paths to YAML in /llm/models) ----------
models.asr.registry_path=llm/models/asr.yaml
models.note_llm.registry_path=llm/models/note_llm.yaml

# ---------- Server: storage ----------
store.db.url=sqlite:///./data/scribe.db
store.audio.dir=./data/audio
store.transcripts.dir=./data/transcripts
store.audio.retention_hours=24
store.audio.format=wav
store.audio.sample_rate=16000
store.audio.channels=1
store.audio.bit_depth=16

# ---------- Server: diarization (v1.1) ----------
diarize.enabled=false
diarize.model=pyannote/speaker-diarization-3.1
diarize.hf_token_env=HF_TOKEN

# ---------- Android client ----------
android.applicationId=com.medicscribe
android.minSdk=26
android.targetSdk=34
android.compileSdk=34
android.versionCode=1
android.versionName=0.0.1
android.audio.sample_rate=16000
android.audio.channels=1
android.audio.bit_depth=16
android.audio.frame_ms=20
android.ws.connect_timeout_ms=5000
android.ws.read_timeout_ms=0

# ---------- Auth (placeholder, MVP = LAN trust) ----------
auth.mode=lan_trust
auth.pin.required=false

# ---------- Logging ----------
log.level=INFO
log.format=json
log.file=./data/scribe.log
