# Note-generation LLM registry — read at server boot
# Swap engine/model here, restart server, no code change.
# Schema validated by server/src/medicscribe_server/llm_client/registry.py.

engine: llama-cpp             # llama-cpp-python OpenAI-compat server
model_id: qwen2.5-14b-q4_k_m  # informational; llama-cpp ignores the model field
model_file: /home/whity/llm_workflow/data/models/qwen2.5-14b-gguf/Qwen2.5-14B-Instruct-Q4_K_M.gguf
revision: null

# llama-cpp-python `python -m llama_cpp.server` on port 8000, no auth.
endpoint: http://localhost:8000/v1
api_key: null
timeout_seconds: 60

# Qwen emits raw text (S: ... O: ... A: ... P: ...), no JSON.
# Wrap as {soap_text: <raw>} so the SOAP schema validates.
response_text_field: soap_text

params:
  max_tokens: 1024
  temperature: 0.0          # greedy: minimize creative invention
  top_p: 1.0

# Guided JSON off; strict-extraction prompt handles structure.
guided_decoding:
  enabled: false
  backend: null

# Optional fallback model — used if the primary returns an empty / invalid response.
fallback:
  enabled: false
  engine: vllm
  model_id: Qwen/Qwen2.5-14B-Instruct-AWQ
  endpoint: http://localhost:8001/v1
