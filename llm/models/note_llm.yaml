# Note-generation LLM registry — read at server boot
# Swap engine/model here, restart server, no code change.
# Schema validated by server/src/medicscribe_server/llm_client/registry.py.

engine: stub                  # was: vllm. Phase 3 builds against stub; flip to vllm when Qwen is served.
model_id: Qwen/Qwen2.5-14B-Instruct-AWQ
revision: null

# Connection details (the server connects to a separate vLLM container)
endpoint: http://localhost:8000/v1
api_key: null                 # not needed for local vllm; set for openai-compat
timeout_seconds: 60

params:
  max_model_len: 32768
  gpu_memory_utilization: 0.55
  max_tokens: 800
  temperature: 0.2
  top_p: 0.9
  top_k: 40
  repetition_penalty: 1.05
  seed: null

guided_decoding:
  enabled: true
  backend: outlines           # outlines | xgrammar | null
  # JSON Schema source: each note template provides its own output_schema.json.

# Optional fallback model — used if the primary returns an empty / invalid response.
fallback:
  enabled: false
  engine: vllm
  model_id: SeaMLLM/SeaLLM-v3-7B-Chat
  endpoint: http://localhost:8001/v1
